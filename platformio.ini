; Root PlatformIO configuration for FairyKame
; Allows opening the project root in VS Code with the PlatformIO IDE extension

[platformio]
default_envs = nodemcu
src_dir = code/arduino/src
include_dir = code/arduino/include
lib_dir = code/arduino/lib

[env:nodemcu]
platform = espressif8266
framework = arduino
board = nodemcuv2
board_build.flash_mode = dio
monitor_speed = 115200
