; Root PlatformIO configuration for FairyKame
; Allows opening the project root in VS Code with the PlatformIO IDE extension

[platformio]
default_envs = nodemcu
src_dir = code/arduino/src
include_dir = code/arduino/include
lib_dir = code/arduino/lib

; --- Default Full Build (Wi-Fi SoftAP + USB Serial) ---
[env:nodemcu]
platform = espressif8266
framework = arduino
board = nodemcuv2
board_build.flash_mode = dio
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.4

; --- Lean Serial-Only Build (No Wi-Fi stack, minimum RAM & Flash) ---
[env:nodemcu-serial-only]
platform = espressif8266
framework = arduino
board = nodemcuv2
board_build.flash_mode = dio
monitor_speed = 115200
build_flags = -D DISABLE_WIFI

; --- Wi-Fi-Only Build (No Serial polling) ---
[env:nodemcu-wifi-only]
platform = espressif8266
framework = arduino
board = nodemcuv2
board_build.flash_mode = dio
monitor_speed = 115200
build_flags = -D DISABLE_SERIAL

; --- Wireless OTA Build (Flashing over Wi-Fi via mDNS) ---
[env:nodemcu-ota]
platform = espressif8266
framework = arduino
board = nodemcuv2
board_build.flash_mode = dio
upload_protocol = espota
upload_port = fairy.local
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.4


